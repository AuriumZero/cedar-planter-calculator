<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cedar Planter Calculator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f4; --bg3: #eeede9;
    --text: #1a1a18; --text2: #6b6b67; --text3: #9a9a96;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --danger-bg: #fcebeb; --danger-text: #a32d2d;
    --radius: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #262624; --bg3: #2e2e2c;
      --text: #f0efe9; --text2: #a8a8a2; --text3: #6e6e6a;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --danger-bg: #501313; --danger-text: #f09595;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
  .app { max-width: 680px; margin: 0 auto; background: var(--bg); border-radius: var(--radius-lg); padding: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; }
  .tabs { display: flex; border: 0.5px solid var(--border2); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.5rem; width: fit-content; }
  .tab { padding: 7px 18px; font-size: 13px; cursor: pointer; border: none; background: transparent; color: var(--text2); font-family: inherit; }
  .tab.active { background: var(--bg2); color: var(--text); font-weight: 500; }
  .tab:not(:last-child) { border-right: 0.5px solid var(--border2); }
  .section { display: none; } .section.active { display: block; }
  .type-toggle { display: flex; border: 0.5px solid var(--border2); border-radius: var(--radius); overflow: hidden; margin-bottom: 1.25rem; width: fit-content; }
  .type-btn { padding: 8px 20px; font-size: 13px; cursor: pointer; border: none; background: transparent; color: var(--text2); font-family: inherit; display: flex; align-items: center; gap: 7px; transition: background 0.15s; }
  .type-btn.active { background: var(--bg2); color: var(--text); font-weight: 500; }
  .type-btn:not(:last-child) { border-right: 0.5px solid var(--border2); }
  .type-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }
  .badge-planter { background: #E6F1FB; color: #0C447C; }
  .badge-frame { background: #EAF3DE; color: #27500A; }
  .badge-trellis { background: #F3E8FD; color: #5B2D8E; }
  @media (prefers-color-scheme: dark) {
    .badge-planter { background: #042C53; color: #B5D4F4; }
    .badge-frame { background: #173404; color: #C0DD97; }
    .badge-trellis { background: #2D1545; color: #D9AAFF; }
  }
  .dim-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
  @media (max-width: 480px) { .dim-grid { grid-template-columns: 1fr 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; color: var(--text2); font-weight: 500; letter-spacing: 0.03em; }
  input[type=number], input[type=text] { width: 100%; padding: 7px 10px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); border: 0.5px solid var(--border2); border-radius: var(--radius); outline: none; }
  input:focus { border-color: #378ADD; box-shadow: 0 0 0 2px rgba(55,138,221,0.15); }
  .hint { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .controls-row { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 1rem; flex-wrap: wrap; }
  .price-row { display: flex; align-items: center; gap: 8px; }
  .price-row > label { font-size: 12px; color: var(--text2); font-weight: 500; letter-spacing: 0.03em; white-space: nowrap; }
  .price-input-wrap { position: relative; display: flex; align-items: center; }
  .price-input-wrap span { position: absolute; left: 10px; font-size: 14px; color: var(--text2); pointer-events: none; }
  .price-input-wrap input { padding-left: 22px; width: 110px; }
  .qty-row { display: flex; align-items: center; gap: 8px; }
  .qty-row > label { font-size: 12px; color: var(--text2); font-weight: 500; letter-spacing: 0.03em; white-space: nowrap; }
  .qty-stepper { display: flex; align-items: center; border: 0.5px solid var(--border2); border-radius: var(--radius); overflow: hidden; }
  .qty-stepper button { width: 32px; height: 34px; border: none; background: var(--bg2); color: var(--text); font-size: 16px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .qty-stepper button:hover { background: var(--bg3); }
  .qty-stepper input { width: 44px; height: 34px; border: none; border-left: 0.5px solid var(--border2); border-right: 0.5px solid var(--border2); text-align: center; font-size: 15px; font-weight: 500; font-family: inherit; background: transparent; color: var(--text); outline: none; padding: 0; }
  .leg-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 4px 10px; border-radius: var(--radius); margin-bottom: 1rem; }
  .leg-badge.eight { background: #EAF3DE; color: #27500A; }
  .leg-badge.ten { background: #E6F1FB; color: #0C447C; }
  @media (prefers-color-scheme: dark) {
    .leg-badge.eight { background: #173404; color: #C0DD97; }
    .leg-badge.ten { background: #042C53; color: #B5D4F4; }
  }
  .depth-card { background: var(--bg2); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 1.25rem; }
  .depth-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .depth-row label { min-width: 90px; margin: 0; }
  input[type=range] { flex: 1; accent-color: #378ADD; }
  .depth-val { font-size: 14px; font-weight: 500; min-width: 100px; text-align: right; }
  .depth-layers { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }
  .depth-block { height: 18px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; font-weight: 500; }
  .depth-info { font-size: 12px; color: var(--text2); margin-top: 8px; }
  .btn-row { display: flex; gap: 10px; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .run-btn { padding: 9px 24px; font-size: 14px; font-weight: 500; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; background: var(--bg2); color: var(--text); font-family: inherit; transition: background 0.15s; }
  .run-btn:hover { background: var(--bg3); }
  .print-btn { padding: 9px 18px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; background: transparent; color: var(--text2); font-family: inherit; display: none; align-items: center; gap: 6px; transition: background 0.15s; }
  .print-btn:hover { background: var(--bg2); color: var(--text); }
  .print-btn.visible { display: flex; }
  .qty-banner { font-size: 12px; color: var(--text2); padding: 8px 14px; background: var(--bg2); border-radius: var(--radius); margin-bottom: 1rem; display: none; }
  .qty-banner.visible { display: block; }
  .cut-list { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1rem; }
  .cut-list-header { display: grid; grid-template-columns: 2.2fr 0.8fr 0.6fr 0.6fr 1fr; padding: 8px 14px; background: var(--bg2); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: var(--text2); border-bottom: 0.5px solid var(--border); }
  .cut-row { display: grid; grid-template-columns: 2.2fr 0.8fr 0.6fr 0.6fr 1fr; padding: 9px 14px; font-size: 13px; border-bottom: 0.5px solid var(--border); align-items: center; }
  .cut-row:last-child { border-bottom: none; }
  .info-row { padding: 8px 14px; font-size: 12px; color: var(--text2); background: var(--bg2); border-bottom: 0.5px solid var(--border); }
  .info-row:last-child { border-bottom: none; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; margin-left: 5px; vertical-align: middle; }
  .tag-leg{background:#E6F1FB;color:#0C447C} .tag-ledger{background:#EAF3DE;color:#27500A}
  .tag-trim{background:#FAEEDA;color:#633806} .tag-long{background:#FBEAF0;color:#72243E}
  .tag-short{background:#EEEDFE;color:#3C3489} .tag-free{background:#EAF3DE;color:#27500A}
  .tag-warn{background:#FAEEDA;color:#633806} .tag-split{background:#F3E8FD;color:#5B2D8E}
  @media (prefers-color-scheme: dark) {
    .tag-leg{background:#042C53;color:#B5D4F4} .tag-ledger{background:#173404;color:#C0DD97}
    .tag-trim{background:#412402;color:#FAC775} .tag-long{background:#4B1528;color:#F4C0D1}
    .tag-short{background:#26215C;color:#CECBF6} .tag-free{background:#173404;color:#C0DD97}
    .tag-warn{background:#412402;color:#FAC775} .tag-split{background:#2D1545;color:#D9AAFF}
  }
  /* Rip cut summary */
  .rip-summary { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1rem; }
  .rip-summary-header { padding: 8px 14px; background: var(--bg2); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: var(--text2); border-bottom: 0.5px solid var(--border); }
  .rip-row { padding: 10px 14px; font-size: 13px; border-bottom: 0.5px solid var(--border); }
  .rip-count { font-weight: 600; }
  .rip-note { font-size: 11px; color: var(--text2); margin-top: 3px; }


  /* Multi-build rows */
  .build-rows { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1rem; }
  .build-row { border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 14px 16px; position: relative; }
  .build-row-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .build-row-label { font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.04em; text-transform: uppercase; }
  .build-del-btn { font-size: 12px; padding: 3px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius); cursor: pointer; background: transparent; color: var(--text2); font-family: inherit; }
  .build-del-btn:hover { color: var(--danger-text); border-color: var(--danger-text); }
  .build-type-toggle { display: flex; border: 0.5px solid var(--border2); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; width: fit-content; }
  .build-type-btn { padding: 6px 14px; font-size: 12px; cursor: pointer; border: none; background: transparent; color: var(--text2); font-family: inherit; display: flex; align-items: center; gap: 5px; }
  .build-type-btn.active { background: var(--bg2); color: var(--text); font-weight: 500; }
  .build-type-btn:not(:last-child) { border-right: 0.5px solid var(--border2); }
  .build-dim-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .build-trellis-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; }
  .build-qty-row { display: flex; align-items: center; gap: 8px; }
  .build-qty-row label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .add-build-btn { font-size: 13px; padding: 8px 18px; border: 0.5px dashed var(--border2); border-radius: var(--radius); cursor: pointer; background: transparent; color: var(--text2); font-family: inherit; margin-bottom: 1rem; width: 100%; text-align: center; }
  .add-build-btn:hover { background: var(--bg2); }
  .cut-section-header { padding: 7px 14px; background: var(--bg3); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--text2); border-bottom: 0.5px solid var(--border); text-transform: uppercase; }
  /* Gang cut guide */
  .gang-section { border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 1.5rem; }
  .gang-section-header { padding: 10px 14px; background: var(--bg2); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: var(--text2); border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 6px; }
  .gang-lines { margin-bottom: 10px; }
  .gang-line { font-size: 13px; color: var(--text2); margin-bottom: 3px; padding-left: 2px; }
  .gang-summary { font-size: 11px; color: var(--text3); }
  .gang-summary-block { padding: 12px 14px; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
  .gang-summary-title { font-size: 11px; font-weight: 600; letter-spacing: 0.03em; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; }
  .gang-summary-line { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .gang-summary-line:last-child { margin-bottom: 0; }
  .pattern-group { padding: 12px 14px; border-bottom: 0.5px solid var(--border); }
  .pattern-group:last-child { border-bottom: none; }
  .pattern-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .cut-steps { display: flex; flex-direction: column; gap: 5px; margin-bottom: 7px; }
  .cut-step { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .cut-step-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border2); }
  .cut-step-label { color: var(--text); }
  .cut-step-sub { color: var(--text2); font-size: 12px; }
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
  .summary-grid-screws { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  @media (max-width: 480px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } .summary-grid-screws { grid-template-columns: repeat(2, 1fr); } }
  .metric { background: var(--bg2); border-radius: var(--radius); padding: 14px 16px; }
  .metric .val { font-size: 22px; font-weight: 600; margin-bottom: 2px; }
  .metric .lbl { font-size: 11px; color: var(--text2); }
  .metric.highlight { border: 0.5px solid var(--border2); }

  .picket-vis-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
  .picket-row-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .pk-num { font-size: 11px; color: var(--text3); min-width: 24px; }
  .pk-note { font-size: 10px; color: var(--text3); }
  .cut-row.editable { grid-template-columns: 2fr 1fr 1fr 1fr 36px; }
  .cut-row.editable input { font-size: 13px; }
  .add-row-btn { font-size: 12px; padding: 5px 14px; border: 0.5px dashed var(--border2); border-radius: var(--radius); cursor: pointer; background: transparent; color: var(--text2); font-family: inherit; margin-bottom: 1rem; }
  .add-row-btn:hover { background: var(--bg2); }
  .del-btn { font-size: 11px; padding: 2px 6px; border: 0.5px solid var(--border); border-radius: 4px; cursor: pointer; background: transparent; color: var(--text3); font-family: inherit; }
  .del-btn:hover { color: var(--danger-text); }
  .error { font-size: 13px; color: var(--danger-text); margin-bottom: 1rem; padding: 10px 14px; background: var(--danger-bg); border-radius: var(--radius); }
  .vis-wrap { overflow-x: auto; margin-bottom: 1.5rem; }

  .build-depth-card { background: var(--bg2); border-radius: var(--radius); padding: 10px 14px; margin-top: 8px; }
  .build-depth-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .build-depth-row label { font-size: 12px; color: var(--text2); font-weight: 500; min-width: 90px; margin: 0; }
  .build-depth-val { font-size: 13px; font-weight: 500; min-width: 90px; text-align: right; white-space: nowrap; }
  .build-depth-layers { display: flex; gap: 2px; flex-wrap: wrap; }
  .build-depth-block { height: 14px; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: white; font-weight: 500; }
  .build-depth-info { font-size: 11px; color: var(--text3); margin-top: 5px; }
</style>
</head>
<body>
<div class="app">
  <h1><i class="ti ti-tools" style="font-size:18px;vertical-align:-2px;margin-right:8px"></i>Cedar Planter Calculator</h1>
  <p class="subtitle">6ft × 5.5in × ⅝in pickets &nbsp;·&nbsp; 71″ usable &nbsp;·&nbsp; Pieces > 71″ split in half</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('auto')">Auto from dimensions</button>
    <button class="tab" onclick="switchTab('manual')">Manual cut list</button>
  </div>

  <div id="section-auto" class="section active">
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:1rem;align-items:flex-end">
      <div class="price-row">
        <label>6FT PICKET PRICE</label>
        <div class="price-input-wrap"><span>$</span><input type="number" id="price-per-picket" value="3.68" min="0" step="0.01"></div>
      </div>
      <div class="price-row" id="price-8ft-row" style="display:none">
        <label>8FT PICKET PRICE <span style="font-size:10px;color:var(--text3)">(trellis back legs)</span></label>
        <div class="price-input-wrap"><span>$</span><input type="number" id="price-per-picket-8ft" value="5.79" min="0" step="0.01"></div>
      </div>
    </div>
    <div class="build-rows" id="build-rows"></div>
    <button class="add-build-btn" onclick="addBuildRow()"><i class="ti ti-plus" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>Add another size</button>
    <div class="btn-row">
      <button class="run-btn" onclick="calcAuto()"><i class="ti ti-calculator" style="font-size:14px;vertical-align:-2px;margin-right:6px"></i>Calculate cut list</button>
      <button class="print-btn" id="auto-print-btn" onclick="printResults('auto')"><i class="ti ti-printer" style="font-size:14px"></i>Print cut list</button>
    </div>
    <div id="auto-error" style="display:none" class="error"></div>
    <div id="auto-results" style="display:none">
      <div id="auto-cut-list"></div>
      <div id="auto-rip"></div>
      <div id="auto-summary"></div>
      <div id="auto-gang"></div>
      <div class="vis-wrap"><div id="auto-pickets"></div></div>
    </div>
  </div>

  <div id="section-manual" class="section">
    <div class="controls-row" style="margin-top:0.5rem">
      <div class="price-row">
        <label>PRICE PER PICKET</label>
        <div class="price-input-wrap"><span>$</span><input type="number" id="price-per-picket-m" value="3.68" min="0" step="0.01"></div>
      </div>
      <div class="qty-row">
        <label>QUANTITY</label>
        <div class="qty-stepper">
          <button onclick="changeQtyM(-1)">−</button>
          <input type="number" id="build-qty-m" value="1" min="1" max="99" step="1" oninput="clampQtyM()">
          <button onclick="changeQtyM(1)">+</button>
        </div>
      </div>
    </div>
    <div id="manual-rows"></div>
    <button class="add-row-btn" onclick="addManualRow()"><i class="ti ti-plus" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>Add piece</button><br>
    <div class="btn-row" style="margin-top:1rem">
      <button class="run-btn" onclick="calcManual()"><i class="ti ti-calculator" style="font-size:14px;vertical-align:-2px;margin-right:6px"></i>Calculate pickets needed</button>
      <button class="print-btn" id="manual-print-btn" onclick="printResults('manual')"><i class="ti ti-printer" style="font-size:14px"></i>Print cut list</button>
    </div>
    <div id="manual-error" style="display:none" class="error"></div>
    <div id="manual-results" style="display:none">
      <div id="manual-qty-banner" class="qty-banner"></div>
      <div id="manual-cut-list"></div>
      <div id="manual-rip"></div>
      <div id="manual-summary"></div>
      <div id="manual-gang"></div>
      <div class="vis-wrap"><div id="manual-pickets"></div></div>
    </div>
  </div>
</div>

<script>
const PICKET_LEN=72,PICKET_W=5.5,LEG_W=2.375,USABLE=71;
const TRIM_STRIPS_PER_PICKET=3,LEG_STRIPS_PER_PICKET=2;
const BOARD_SPLIT_THRESHOLD=71,TRIM_SPLIT_THRESHOLD=72,LEG_SPLIT_THRESHOLD=72;
const MAX_GANG=4;
let planterType='planter';
let lastLegInfo={legPickets:0,extraLedgerPicket:0,legStrips:[],hasLedger:false};
let lastTrimResult={pickets:0,strips:[]};
let lastSidePickets=[];



function changeQtyM(d){const el=document.getElementById('build-qty-m');el.value=Math.max(1,Math.min(99,(parseInt(el.value)||1)+d));}

function clampQtyM(){const el=document.getElementById('build-qty-m');el.value=Math.max(1,Math.min(99,parseInt(el.value)||1));}

function applySplit(length,qty,threshold){
  if(length>threshold)return{length:length/2,qty:qty*2,split:true};
  return{length,qty,split:false};
}

function floorBoardCount(L){return Math.floor(L/(PICKET_W*2))*2+1;}
function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='auto')||(i===1&&t==='manual')));
  document.getElementById('section-auto').classList.toggle('active',t==='auto');
  document.getElementById('section-manual').classList.toggle('active',t==='manual');
}




function numLegsForLength(L){return L<=48?8:10;}



function fmtF(n){const w=Math.floor(n),r=n-w;if(r<0.01)return w+'″';if(Math.abs(r-0.25)<0.02)return w+'¼″';if(Math.abs(r-0.5)<0.02)return w+'½″';if(Math.abs(r-0.75)<0.02)return w+'¾″';return n.toFixed(3)+'″';}
function fmtMoney(n){return '$'+n.toFixed(2);}
function pieceType(name){const l=name.toLowerCase();if(l.includes('leg'))return 'leg';if(l.includes('ledger'))return 'ledger';if(l.includes('trim'))return 'trim';if(l.includes('long'))return 'long';return 'short';}
function tagHtml(t,label){const map={leg:'Leg',ledger:'Ledger',trim:'Trim',long:'Long side',short:'Short side',trellis_strip:'Trellis strip'};return `<span class="tag tag-${t}">${label||map[t]||t}</span>`;}

// Gang cut guide: groups pieces into gangs of up to MAX_GANG
function buildGangGuide(pieces){
  const eligible=pieces.filter(p=>p.type==='long'||p.type==='short');
  if(!eligible.length)return'';

  // Group sidePickets by identical cut pattern
  const patterns={};
  lastSidePickets.forEach(pk=>{
    const key=pk.pieces.map(p=>p.label+'|'+p.len).join('::');
    if(!patterns[key]){
      patterns[key]={cuts:pk.pieces.map(p=>({label:p.label,len:p.len,type:p.type})),count:0,waste:pk.waste};
    }
    patterns[key].count++;
  });

  const patternList=Object.values(patterns);

  // Build gang tally
  const gangTally={};
  patternList.forEach(g=>{
    const fullGangs=Math.floor(g.count/MAX_GANG);
    const rem=g.count%MAX_GANG;
    if(fullGangs>0) gangTally[MAX_GANG]=(gangTally[MAX_GANG]||0)+fullGangs;
    if(rem>0) gangTally[rem]=(gangTally[rem]||0)+1;
  });

  const summaryLines=Object.keys(gangTally).map(Number).sort((a,b)=>b-a).map(sz=>{
    const count=gangTally[sz];
    if(sz===1) return `${count} solo picket${count!==1?'s':''}`;
    return `${count} gang${count!==1?'s':''} of ${sz}`;
  });

  const summaryHtml=`<div class="gang-summary-block">
    <div class="gang-summary-title">Number of gangs required:</div>
    ${summaryLines.map(l=>`<div class="gang-summary-line">${l}</div>`).join('')}
  </div>`;

  let patternHtml='';
  patternList.forEach((g,pi)=>{
    const letter=String.fromCharCode(65+pi);
    const fullGangs=Math.floor(g.count/MAX_GANG);
    const rem=g.count%MAX_GANG;

    // Plain text gang breakdown instead of pills
    let gangLines='';
    if(fullGangs>0) gangLines+=`<div class="gang-line">${fullGangs} gang${fullGangs!==1?'s':''} of ${MAX_GANG} pickets</div>`;
    if(rem>0) gangLines+=`<div class="gang-line">${rem===1?'1 solo picket':`1 gang of ${rem} pickets`}</div>`;

    let steps='';
    g.cuts.forEach((c,ci)=>{
      const isLong=c.type==='long'||c.label.toLowerCase().includes('long');
      const typeLbl=isLong?'long side board':'short side / floor board';
      steps+=`<div class="cut-step">
        <span class="cut-step-num">${ci+1}</span>
        <span class="cut-step-label">Cut at <strong>${fmtF(c.len)}</strong></span>
        <span class="cut-step-sub">\u2192 ${typeLbl}</span>
      </div>`;
    });

    const cutWord=g.cuts.length===1?'cut':'cuts';
    patternHtml+=`<div class="pattern-group">
      <div class="pattern-title">Pattern ${letter} &nbsp;\u00b7&nbsp; ${g.count} picket${g.count!==1?'s':''} &nbsp;\u00b7&nbsp; ${g.cuts.length} ${cutWord} each</div>
      <div class="gang-lines">${gangLines}</div>
      <div class="cut-steps">${steps}</div>
    </div>`;
  });

  return `<div class="gang-section">
    <div class="gang-section-header"><i class="ti ti-stack-2" aria-hidden="true" style="font-size:14px"></i>Gang cut guide \u2014 stack pickets with the same pattern, nail together, cut once per position</div>
    ${summaryHtml}
    ${patternHtml}
  </div>`;
}


function gangCalc(p){
  const cutsPerPicket=Math.max(1,Math.floor(USABLE/p.length));
  const picketsNeeded=Math.ceil(p.qty/cutsPerPicket);
  const fullGangs=Math.floor(picketsNeeded/MAX_GANG);
  const remainder=picketsNeeded%MAX_GANG;
  const totalGangs=fullGangs+(remainder>0?1:0);
  return{cutsPerPicket,picketsNeeded,fullGangs,remainder,totalGangs};
}


function packIntoStrips(pieces,stripsPerPicket,maxLen){
  const ML=maxLen||USABLE;
  let cuts=[];pieces.forEach(p=>{for(let i=0;i<p.qty;i++)cuts.push({label:p.name,len:p.length,type:p.type});});
  cuts.sort((a,b)=>b.len-a.len);
  let strips=[],remaining=[...cuts];
  while(remaining.length>0){
    let strip={used:0,pieces:[]},next=[];
    for(let c of remaining){if(c.len<=ML&&strip.used+c.len<=ML){strip.used+=c.len;strip.pieces.push(c);}else next.push(c);}
    if(strip.pieces.length===0){strip.pieces.push(remaining[0]);strip.used=remaining[0].len;next=remaining.slice(1);}
    strip.waste=ML-strip.used;strips.push(strip);remaining=next;
  }
  return{pickets:Math.ceil(strips.length/stripsPerPicket),strips};
}
function calcLegInfo(numLegsStd,stdLegH,numLegsBack,backLegH,trellisStripLen,trellisStripQty,trellisVertH,trellisVertQty){
  // Build pool of all ripped-strip cuts: standard legs, back legs, trellis strips
  const pool=[];
  // Standard legs
  const stdS=applySplit(stdLegH,numLegsStd,LEG_SPLIT_THRESHOLD);
  pool.push({name:'Legs',type:'leg',qty:stdS.qty,length:stdS.length,split:stdS.split,subtype:'std'});
  // Back legs (trellis only — full height)
  if(numLegsBack>0){
    const backS=applySplit(backLegH,numLegsBack,LEG_SPLIT_THRESHOLD);
    pool.push({name:'Back legs (full height)',type:'leg',qty:backS.qty,length:backS.length,split:backS.split,subtype:'back'});
  }
  // Trellis horizontal strips (same width as legs, packed in same pool)
  if(trellisStripQty>0){
    const tsS=applySplit(trellisStripLen,trellisStripQty,TRIM_SPLIT_THRESHOLD);
    pool.push({name:'Trellis strips',type:'trellis_strip',qty:tsS.qty,length:tsS.length,split:tsS.split,subtype:'tstrip'});
  }
  // Trellis vertical side rails (2 per unit, cut at trellis height)
  if(trellisVertQty>0){
    const tvS=applySplit(trellisVertH,trellisVertQty,LEG_SPLIT_THRESHOLD);
    pool.push({name:'Trellis side rails',type:'trellis_strip',qty:tvS.qty,length:tvS.length,split:tvS.split,subtype:'trail'});
  }
  const r=packIntoStrips(pool,LEG_STRIPS_PER_PICKET,72);
  if(planterType==='frame')return{legPickets:r.pickets,extraLedgerPicket:0,legStrips:r.strips,hasLedger:false,pool};
  return{legPickets:r.pickets,extraLedgerPicket:r.pickets<2?1:0,legStrips:r.strips,hasLedger:true,pool};
}
function packPieces(pieces){
  let cuts=[];pieces.forEach(p=>{for(let i=0;i<p.qty;i++)cuts.push({label:p.name,len:p.length,type:p.type});});
  cuts.sort((a,b)=>b.len-a.len);
  let pickets=[],remaining=[...cuts];
  while(remaining.length>0){
    let pk={used:0,pieces:[]},next=[];
    for(let c of remaining){if(pk.used+c.len<=USABLE){pk.used+=c.len;pk.pieces.push(c);}else next.push(c);}
    if(pk.pieces.length===0){pk.pieces.push(remaining[0]);pk.used=remaining[0].len;next=remaining.slice(1);}
    pk.waste=USABLE-pk.used;pickets.push(pk);remaining=next;
  }
  return pickets;
}
function renderCutList(pieces,legInfo,trimResult){
  let rows=pieces.map(p=>{
    const isFree=p.type==='ledger';
    const splitTag=p.split?`<span class="tag tag-split">Split \u00d72 @ ${fmtF(p.length)}</span>`:'';
    return `<div class="cut-row"><div>${p.name}${tagHtml(p.type)}${isFree?tagHtml('free','Free \u2014 leg rips'):''}${splitTag}</div><div style="color:var(--text2)">${fmtF(p.length)} \u00d7 ${fmtF(p.width)}</div><div style="color:var(--text2)">${p.qtyPerUnit}</div><div style="font-weight:500">${p.qty}</div><div style="color:var(--text2);font-size:12px">${isFree?'\u2014':fmtF(p.length*p.qty/12)+' ln\u00b7ft'}</div></div>`;
  }).join('');
  return `<div class="cut-list"><div class="cut-list-header"><div>Piece</div><div>Dims (L \u00d7 W)</div><div>Per unit</div><div>Total qty</div><div>Lin. ft</div></div>${rows}</div>`;
}
function calcScrews(configs){
  // Per build per unit:
  //   L > 48": 6x 1" screws per board-height row (depthRows) + 4x 1.25" screws
  //   L <= 48": 4x 1" screws per board-height row (depthRows) + 4x 1.25" screws
  let screws1in=0, screws125in=0;
  configs.forEach(c=>{
    const perRow = c.L > 48 ? 6 : 4;
    screws1in   += perRow * c.depthRows * c.qty;
    screws125in += 4 * c.qty;
  });
  return {screws1in, screws125in};
}
function renderSummary(legInfo,trimResult,sidePickets,price,qty,pieces,configs,backLegPickets,price8ft){
  backLegPickets=backLegPickets||0; price8ft=price8ft||0;
  const stdPickets=legInfo.legPickets+legInfo.extraLedgerPicket+trimResult.pickets+sidePickets.length;
  const total=stdPickets+backLegPickets;
  const costStd=stdPickets*price, costBack=backLegPickets*price8ft, cost=costStd+costBack;
  const sw=sidePickets.reduce((s,p)=>s+p.waste,0),su=sidePickets.length*USABLE;
  const eff=su>0?Math.round((1-sw/su)*100):0;
  const gangSetups=pieces.filter(p=>p.type==='long'||p.type==='short').reduce((s,p)=>{
    const {totalGangs,cutsPerPicket}=gangCalc(p);
    return s+totalGangs*cutsPerPicket;
  },0);
  const nonGangCuts=legInfo.legStrips.reduce((s,st)=>s+st.pieces.length,0)+trimResult.strips.reduce((s,st)=>s+st.pieces.length,0);
  const totalSawSetups=gangSetups+nonGangCuts;
  const qtyNote=qty>1?` <span style="color:var(--text2);font-size:12px">(${qty} units)</span>`:'';
  const {screws1in, screws125in} = configs ? calcScrews(configs) : {screws1in:0, screws125in:0};
  const backLegTile = backLegPickets>0 ? `<div class="metric"><div class="val">${backLegPickets}</div><div class="lbl">8ft pickets (back legs) \u00b7 ${fmtMoney(costBack)}</div></div>` : '';
  return `<div class="summary-grid">
    <div class="metric"><div class="val">${stdPickets}</div><div class="lbl">6ft pickets \u00b7 ${fmtMoney(costStd)}</div></div>
    <div class="metric highlight"><div class="val">${fmtMoney(cost)}${qtyNote}</div><div class="lbl">Est. total material cost</div></div>
    <div class="metric"><div class="val">${eff}%</div><div class="lbl">Board efficiency</div></div>
    <div class="metric"><div class="val">${totalSawSetups}</div><div class="lbl">Total saw setups</div></div>
  </div>
  ${backLegTile ? `<div class="summary-grid-screws">${backLegTile}</div>` : ''}
  <div class="summary-grid-screws">
    <div class="metric"><div class="val">${screws1in}</div><div class="lbl">1\u2033 screws (side boards)</div></div>
    <div class="metric"><div class="val">${screws125in}</div><div class="lbl">1\u00bc\u2033 screws (structural/legs)</div></div>
  </div>`;
}

  allBuildData.forEach(bd => {
    const c = bd.config;

  if(legInfo.extraLedgerPicket){
    let svg=`<rect x="0" y="0" width="${uw}" height="${sh}" fill="${ledgerColor}" opacity="0.85" rx="2"/>`;
    svg+=`<text x="${uw/2}" y="${sh/2+4}" text-anchor="middle" font-size="8" fill="white" font-family="inherit">ledger</text>`;
    svg+=`<rect x="${uw}" y="0" width="${dw}" height="${sh}" fill="#ccc" opacity="0.5"/>`;
    svg+=`<rect x="0" y="0" width="${pw}" height="${sh}" fill="none" stroke="#bbb" stroke-width="0.5" rx="2"/>`;
    legRows+=rowWrap('L+',sh,svg,'extra — 2nd ledger');
  }

  // Trim pickets
  const tph=sh*3+gap*2;let trimRows='';
  for(let pk=0;pk<trimResult.pickets;pk++){
    let svg='';
    for(let s=0;s<TRIM_STRIPS_PER_PICKET;s++){
      const si=pk*TRIM_STRIPS_PER_PICKET+s,strip=trimResult.strips[si],y=s*(sh+gap);
      const pcs=strip?strip.pieces:[];
      svg+=stripRow(pcs,y,trimColors,null);
    }
    trimRows+=rowWrap('T'+(pk+1),tph,svg,'3 strips × 71″');
  }

  // Side pickets
  const svh=22;let sideRows='';
  sidePickets.forEach((pk,i)=>{
    let r='',x=0;
    pk.pieces.forEach((p,j)=>{
      const w=Math.round(p.len*scale),c=sideColors[j%sideColors.length];
      r+=`<rect x="${x}" y="1" width="${w}" height="${svh-2}" fill="${c}" opacity="0.85" rx="2"/>`;
      if(w>30)r+=`<text x="${x+w/2}" y="${svh/2+5}" text-anchor="middle" font-size="9" fill="white" font-family="inherit">${Math.round(p.len)}</text>`;
      x+=w;
    });
    const ww=uw-x;if(ww>0)r+=`<rect x="${x}" y="1" width="${ww}" height="${svh-2}" fill="#eee" rx="2"/>`;
    r+=`<rect x="${uw}" y="1" width="${dw}" height="${svh-2}" fill="#ccc" opacity="0.5"/>`;
    r+=`<rect x="0" y="0" width="${pw}" height="${svh}" fill="none" stroke="#bbb" stroke-width="0.5" rx="2"/>`;
    sideRows+=rowWrap('S'+(i+1),svh,r,Math.round(pk.waste*10)/10+'″ left');
  });

  const visLabel=planterType==='frame'
    ?'L# — leg pickets &nbsp;·&nbsp; T# — trim pickets &nbsp;·&nbsp; S# — side pickets'
    :'L# — leg pickets &nbsp;·&nbsp; T# — trim pickets &nbsp;·&nbsp; S# — side & floor pickets';

  return `<div style="margin-bottom:1.5rem;page-break-inside:avoid">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px;border-top:1px solid #eee;padding-top:1rem;">Picket layout diagram</div>
    <div style="font-size:10px;color:#aaa;margin-bottom:8px">${visLabel} &nbsp;·&nbsp; gray = dog ear (unusable)</div>
    ${sectionHdr('Leg pickets')}${legRows}
    ${sectionHdr('Trim pickets')}${trimRows}
    ${sectionHdr('Side & floor pickets')}${sideRows}
  </div>`;
}

function buildPieces(L,W,H,TH,depthRows,qty){
  function ms(rawLen,rawQtyPerUnit,threshold){
    const s=applySplit(rawLen,rawQtyPerUnit,threshold);
    return{length:s.length,qtyPerUnit:s.qty,qty:s.qty*qty,split:s.split};
  }
  const rawLongSide=L-1.25,rawShortSide=W-2.5,rawLedgerL=L-3.5;
  const numLegsTotal=numLegsForLength(L);
  const numLegsBack=planterType==='trellis'?3:0;
  const numLegsStd=numLegsTotal-numLegsBack;
  const rawStdLegH=H-0.5;
  const rawBackLegH=H+TH; // full height for back legs
  // Trellis strips: same width as legs, span full length, spaced 1" apart
  const trellisStripCount=planterType==='trellis'?Math.floor(TH/(LEG_W+1)):0;
  const rawTrellisStripLen=L;

  // Standard legs
  const stdLegS=applySplit(rawStdLegH,numLegsStd,LEG_SPLIT_THRESHOLD);
  // Back legs
  const backLegS=planterType==='trellis'?applySplit(rawBackLegH,numLegsBack*qty,LEG_SPLIT_THRESHOLD):{length:0,qty:0,split:false};
  // Trellis horizontal strips
  const tStripS=planterType==='trellis'?applySplit(rawTrellisStripLen,trellisStripCount*qty,TRIM_SPLIT_THRESHOLD):{length:0,qty:0,split:false};
  // Trellis vertical side rails (2 per unit, cut at trellis height)
  const tVertS=planterType==='trellis'?applySplit(TH,2*qty,LEG_SPLIT_THRESHOLD):{length:0,qty:0,split:false};

  const longR=ms(rawLongSide,depthRows*2,BOARD_SPLIT_THRESHOLD);
  const shortR=ms(rawShortSide,depthRows*2,BOARD_SPLIT_THRESHOLD);
  const tlR=ms(L,2,TRIM_SPLIT_THRESHOLD),tsR=ms(W,2,TRIM_SPLIT_THRESHOLD);

  const pieces=[];

  // Standard legs
  pieces.push({name:'Legs',type:'leg',qtyPerUnit:applySplit(rawStdLegH,numLegsStd,LEG_SPLIT_THRESHOLD).qty,qty:applySplit(rawStdLegH,numLegsStd,LEG_SPLIT_THRESHOLD).qty*qty,length:stdLegS.length,width:LEG_W,split:stdLegS.split});

  // Back legs (trellis only)
  if(planterType==='trellis'){
    pieces.push({name:'Back legs (full height)',type:'leg',qtyPerUnit:applySplit(rawBackLegH,numLegsBack,LEG_SPLIT_THRESHOLD).qty,qty:backLegS.qty,length:backLegS.length,width:LEG_W,split:backLegS.split});
    pieces.push({name:`Trellis strips (${trellisStripCount} per unit)`,type:'trellis_strip',qtyPerUnit:tStripS.qty/qty,qty:tStripS.qty,length:tStripS.length,width:LEG_W,split:tStripS.split});
    pieces.push({name:'Trellis side rails',type:'trellis_strip',qtyPerUnit:tVertS.qty/qty,qty:tVertS.qty,length:tVertS.length,width:LEG_W,split:tVertS.split});
  }

  // Ledgers (planter + trellis have ledgers, frame does not)
  if(planterType!=='frame'){
    const ledR=ms(rawLedgerL,2,BOARD_SPLIT_THRESHOLD);
    pieces.push({name:'Ledgers',type:'ledger',...ledR,width:0.5});
  }

  pieces.push(
    {name:'Trim (long)',type:'trim',...tlR,width:1.75},
    {name:'Trim (short)',type:'trim',...tsR,width:1.75},
    {name:'Long side boards',type:'long',...longR,width:PICKET_W},
  );

  if(planterType!=='frame'){
    const floor=floorBoardCount(L),floorR=ms(rawShortSide,floor,BOARD_SPLIT_THRESHOLD);
    const totalQtyPerUnit=shortR.qtyPerUnit+floorR.qtyPerUnit;
    pieces.push({name:`Short side boards (${shortR.qtyPerUnit}) + floor boards (${floorR.qtyPerUnit})`,type:'short',length:shortR.length,qtyPerUnit:totalQtyPerUnit,qty:totalQtyPerUnit*qty,width:PICKET_W,split:shortR.split||floorR.split});
  } else {
    pieces.push({name:'Short side boards',type:'short',...shortR,width:PICKET_W});
  }

  return{pieces,numLegsStd,numLegsBack,rawStdLegH,rawBackLegH,trellisStripCount,rawTrellisStripLen,stdLegS,backLegS,tStripS,tVertS};
}

function updateBuildDepth(id){
  const row=document.getElementById(id);
  if(!row)return;
  const H=parseFloat(row.querySelector('.b-h').value)||24;
  const max=Math.max(1,Math.floor(H/PICKET_W));
  const sl=row.querySelector('.b-depth');
  if(!sl)return;
  sl.max=max;
  if(parseInt(sl.value)>max)sl.value=max;
  const boards=parseInt(sl.value)||max;
  if(!boards)return;
  const dep=boards*PICKET_W;
  const valEl=document.getElementById(id+'-depth-val');
  const layersEl=document.getElementById(id+'-depth-layers');
  const infoEl=document.getElementById(id+'-depth-info');
  const cols=['#378ADD','#5DCAA5','#D85A30','#7F77DD','#BA7517','#D4537E'];
  const bw=Math.max(14,Math.floor(300/max)-2);
  if(valEl)valEl.textContent=dep+String.fromCharCode(8243)+' '+String.fromCharCode(183)+' '+boards+' row'+(boards!==1?'s':'');
  if(layersEl)layersEl.innerHTML=Array.from({length:max},function(_,i){return '<div class="build-depth-block" style="width:'+bw+'px;background:'+(i<boards?cols[i%cols.length]:'#ccc')+';opacity:'+(i<boards?1:0.3)+'">'+(i<boards?PICKET_W+String.fromCharCode(8243):'')+' </div>';}).join('');
  if(infoEl)infoEl.textContent=dep+String.fromCharCode(8243)+' depth '+String.fromCharCode(183)+' '+(boards*2)+' long side boards '+String.fromCharCode(183)+' '+(boards*2)+' short side boards';
}

function getBuildConfigs(){
  const configs = [];
  document.querySelectorAll('.build-row').forEach((row, i) => {
    const typeBtn = row.querySelector('.build-type-btn.active');
    const type = typeBtn ? (typeBtn.textContent.trim().toLowerCase().startsWith('plan') ? 'planter' : typeBtn.textContent.trim().toLowerCase().startsWith('fra') ? 'frame' : 'trellis') : 'planter';
    const L = parseFloat(row.querySelector('.b-l').value) || 72;
    const W = parseFloat(row.querySelector('.b-w').value) || 24;
    const H = parseFloat(row.querySelector('.b-h').value) || 24;
    const TH = type==='trellis' ? (parseFloat(row.querySelector('.b-t').value) || 48) : 0;
    const qty = Math.max(1, parseInt(row.querySelector('.b-qty').value) || 1);
    const dsl=row.querySelector('.b-depth');
    const depthRows=dsl?Math.max(1,parseInt(dsl.value)||1):Math.floor(H/PICKET_W);
    configs.push({type, L, W, H, TH, qty, depthRows, label:`Build ${i+1}`});
  });
  return configs;
}

function calcAuto(){
  const configs = getBuildConfigs();
  const price = parseFloat(document.getElementById('price-per-picket').value) || 0;
  const err = document.getElementById('auto-error'), res = document.getElementById('auto-results');
  err.style.display='none'; res.style.display='none';

  if(configs.length === 0){ err.textContent='Add at least one build.'; err.style.display='block'; return; }
  for(let i=0;i<configs.length;i++){
    const c=configs[i];
    if(!c.L||!c.W||!c.H||c.L<1||c.W<1||c.H<1){ err.textContent=`${c.label}: please enter valid dimensions.`; err.style.display='block'; return; }
    if(c.type==='trellis'&&(!c.TH||c.TH<1)){ err.textContent=`${c.label}: please enter a valid trellis height.`; err.style.display='block'; return; }
  }

  // Generate pieces per build, tag each piece with its build label
  const allBuildData = configs.map(c => {
    planterType = c.type; // set global for buildPieces/calcLegInfo
    const bp = buildPieces(c.L, c.W, c.H, c.TH, c.depthRows, c.qty);
    bp.pieces.forEach(p => { p.buildLabel = c.label; p.buildType = c.type; });
    return { config:c, ...bp };
  });

  // Show/hide 8ft price input only when a trellis build's back legs exceed 72" (needs 8ft pickets)
  const hasTrellis = configs.some(c=>c.type==='trellis' && (c.H+c.TH) > 72);
  document.getElementById('price-8ft-row').style.display = hasTrellis ? '' : 'none';
  const price8ft = parseFloat(document.getElementById('price-per-picket-8ft').value) || 0;

  // ── Pool all leg/trellis strip pieces across builds ───────────────────────
  const legPool = [];
  const backLegPool = []; // 8ft pickets for trellis back legs, packed separately
  allBuildData.forEach(bd => {
    const c = bd.config;
    planterType = c.type;
    // Standard legs
    const stdS = applySplit(c.H-0.5, bd.numLegsStd*c.qty, LEG_SPLIT_THRESHOLD);
    if(stdS.qty>0) legPool.push({name:`${c.label} — Legs`, type:'leg', qty:stdS.qty, length:stdS.length, buildLabel:c.label});
    // Back legs (trellis only) — use 8ft pickets only if H+TH > 72", otherwise fold into standard 6ft pool
    if(bd.numLegsBack>0){
      const backLegH = c.H+c.TH;
      if(backLegH > 72){
        const backS = applySplit(backLegH, bd.numLegsBack*c.qty, 96);
        if(backS.qty>0) backLegPool.push({name:`${c.label} — Back legs (8ft)`, type:'leg', qty:backS.qty, length:backS.length, buildLabel:c.label});
      } else {
        const backS = applySplit(backLegH, bd.numLegsBack*c.qty, LEG_SPLIT_THRESHOLD);
        if(backS.qty>0) legPool.push({name:`${c.label} — Back legs`, type:'leg', qty:backS.qty, length:backS.length, buildLabel:c.label});
      }
    }
    // Trellis strips
    if(bd.tStripS && bd.tStripS.qty>0){
      legPool.push({name:`${c.label} — Trellis strips`, type:'trellis_strip', qty:bd.tStripS.qty, length:bd.tStripS.length, buildLabel:c.label});
    }
    // Trellis side rails
    if(bd.tVertS && bd.tVertS.qty>0){
      legPool.push({name:`${c.label} — Trellis side rails`, type:'trellis_strip', qty:bd.tVertS.qty, length:bd.tVertS.length, buildLabel:c.label});
    }
  });
  const legResult = packIntoStrips(legPool, LEG_STRIPS_PER_PICKET, 72);
  const backLegResult = packIntoStrips(backLegPool, 2, 96); // 2 strips per 8ft picket

  // ── Pool all trim pieces ──────────────────────────────────────────────────
  const trimPool = [];
  allBuildData.forEach(bd => {
    const c = bd.config;
    const tlS = applySplit(c.L, 2*c.qty, TRIM_SPLIT_THRESHOLD);
    const tsS = applySplit(c.W, 2*c.qty, TRIM_SPLIT_THRESHOLD);
    if(tlS.qty>0) trimPool.push({name:`${c.label} — Trim (long)`, type:'trim', qty:tlS.qty, length:tlS.length, buildLabel:c.label});
    if(tsS.qty>0) trimPool.push({name:`${c.label} — Trim (short)`, type:'trim', qty:tsS.qty, length:tsS.length, buildLabel:c.label});
  });
  const trimResult = packIntoStrips(trimPool, TRIM_STRIPS_PER_PICKET);

  // ── Pool all side/floor pieces ────────────────────────────────────────────
  const sidePool = [];
  allBuildData.forEach(bd => {
    bd.pieces.filter(p=>p.type==='long'||p.type==='short').forEach(p=>sidePool.push(p));
  });
  const sidePickets = packPieces(sidePool);

  // ── Build combined legInfo for summary ────────────────────────────────────
  const hasLedger = allBuildData.some(bd => bd.config.type !== 'frame');
  const extraLedgerPicket = hasLedger && legResult.pickets < 2 ? 1 : 0;
  const combinedLegInfo = {legPickets:legResult.pickets, extraLedgerPicket, legStrips:legResult.strips, hasLedger};

  // ── Build combined pieces list grouped by build ───────────────────────────
  const allPieces = [];
  allBuildData.forEach(bd => { allPieces.push(...bd.pieces); });

  // Set global planterType to 'planter' for summary rendering (mixed builds)
  planterType = allBuildData.length === 1 ? allBuildData[0].config.type : 'planter';

  lastLegInfo = combinedLegInfo; lastTrimResult = trimResult; lastSidePickets = sidePickets;

  document.getElementById('auto-cut-list').innerHTML = renderMultiCutList(allBuildData, combinedLegInfo, trimResult);
  document.getElementById('auto-rip').innerHTML = renderRipCutSummary(combinedLegInfo, trimResult, backLegResult.pickets);
  document.getElementById('auto-summary').innerHTML = renderSummary(combinedLegInfo, trimResult, sidePickets, price, configs.reduce((s,c)=>s+c.qty,0), allPieces, configs, backLegResult.pickets, price8ft);
  document.getElementById('auto-gang').innerHTML = buildGangGuide(allPieces);
  document.getElementById('auto-pickets').innerHTML = renderPicketVis(combinedLegInfo, trimResult, sidePickets);
  res.style.display='block';
  document.getElementById('auto-print-btn').classList.add('visible');
}

let manualId=0;
const defaultRows=[
  {name:'Legs',qty:10,length:23.5,width:2.375},{name:'Ledgers',qty:2,length:68.5,width:0.5},
  {name:'Trim (long)',qty:2,length:72,width:1.75},{name:'Trim (short)',qty:2,length:24,width:1.75},
  {name:'Long side boards',qty:8,length:70.75,width:5.5},{name:'Short side + floor boards',qty:21,length:21.5,width:5.5},
];
function addManualRow(d={}){
  const id='mr-'+(manualId++),div=document.createElement('div');
  div.id=id;div.className='cut-row editable';
  div.innerHTML=`<input type="text" placeholder="Piece name" value="${d.name||''}"><input type="number" placeholder='Length″' value="${d.length||''}" min="0.1" step="0.125"><input type="number" placeholder="Qty ea." value="${d.qty||1}" min="1" step="1"><input type="number" placeholder='Width″' value="${d.width||PICKET_W}" min="0.1" step="0.125"><button class="del-btn" onclick="document.getElementById('${id}').remove()"><i class="ti ti-x"></i></button>`;
  document.getElementById('manual-rows').appendChild(div);
}
function calcManual(){
  const rows=document.querySelectorAll('#manual-rows .cut-row.editable');
  const err=document.getElementById('manual-error'),res=document.getElementById('manual-results');
  const price=parseFloat(document.getElementById('price-per-picket-m').value)||0;
  const qty=getBuildQty('manual');
  err.style.display='none';res.style.display='none';
  let pieces=[],legPiece=null;
  for(let row of rows){
    const inputs=row.querySelectorAll('input');
    const name=inputs[0].value.trim()||'Piece',len=parseFloat(inputs[1].value),qtyPerUnit=parseInt(inputs[2].value),w=parseFloat(inputs[3].value)||PICKET_W;
    if(!len||!qtyPerUnit){err.textContent='All rows need a length and quantity.';err.style.display='block';return;}
    const type=pieceType(name),threshold=type==='trim'?TRIM_SPLIT_THRESHOLD:BOARD_SPLIT_THRESHOLD;
    const s=applySplit(len,qtyPerUnit,threshold);
    pieces.push({name,type,qtyPerUnit:s.qty,qty:s.qty*qty,length:s.length,width:w,split:s.split});
    if(type==='leg')legPiece={qty:s.qty*qty,length:s.length};
  }
  if(pieces.length===0){err.textContent='Add at least one piece.';err.style.display='block';return;}
  const legInfo=legPiece?calcLegInfo(legPiece.qty,legPiece.length):{legPickets:0,extraLedgerPicket:0,legStrips:[],hasLedger:false};
  const trimResult=packIntoStrips(pieces.filter(p=>p.type==='trim'),TRIM_STRIPS_PER_PICKET);
  const sidePickets=packPieces(pieces.filter(p=>p.type==='long'||p.type==='short'));
  const banner=document.getElementById('manual-qty-banner');
  if(qty>1){banner.textContent=`Showing combined cut list for ${qty} units.`;banner.classList.add('visible');}
  else banner.classList.remove('visible');
  lastLegInfo=legInfo;lastTrimResult=trimResult;lastSidePickets=sidePickets;
  document.getElementById('manual-cut-list').innerHTML=renderCutList(pieces,legInfo,trimResult);
  document.getElementById('manual-rip').innerHTML=renderRipCutSummary(legInfo,trimResult);
  document.getElementById('manual-summary').innerHTML=renderSummary(legInfo,trimResult,sidePickets,price,qty,pieces);
  document.getElementById('manual-gang').innerHTML=buildGangGuide(pieces);
  document.getElementById('manual-pickets').innerHTML=renderPicketVis(legInfo,trimResult,sidePickets);
  res.style.display='block';
  document.getElementById('manual-print-btn').classList.add('visible');
}
const hdr=document.createElement('div');
hdr.className='cut-list-header';hdr.style.gridTemplateColumns='2fr 1fr 1fr 1fr 36px';
hdr.innerHTML='<div>Name</div><div>Length (in)</div><div>Qty ea.</div><div>Total qty</div><div></div>';
document.getElementById('manual-rows').appendChild(hdr);
defaultRows.forEach(r=>addManualRow(r));
addBuildRow(); // start with one default build row
</script>
